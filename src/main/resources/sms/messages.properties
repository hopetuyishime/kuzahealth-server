# SMS templates (English). Arguments are positional; a single quote must be written as ''.
# visit.scheduled: 0 = parent first name, 1 = visit type, 2 = date, 3 = time
visit.scheduled=Hello {0}, a visit ({1}) has been scheduled for you on {2} at {3}. KuzaHealth
# visit.reminder: 0 = visit type, 1 = date, 2 = time, 3 = location
visit.reminder=Reminder: you have a visit ({0}) on {1} at {2}, {3}. KuzaHealth
# visit.missed: 0 = date
visit.missed=We missed you at your visit on {0}. Please contact your health worker to reschedule. KuzaHealth
# vaccination.recorded: 0 = vaccine, 1 = child name, 2 = date
vaccination.recorded={0} vaccination was recorded for {1} on {2}. KuzaHealth
# vaccination.due: 0 = vaccine, 1 = child name, 2 = date
vaccination.due=Reminder: {1} is due for the {0} vaccination on {2}. Please bring the child to your health centre. KuzaHealth
