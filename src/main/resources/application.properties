spring.application.name=kuzahealth-server
spring.main.banner-mode=off
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

# Logging
logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:WARN}
logging.level.org.springframework=ERROR
logging.level.com.zaxxer.hikari=ERROR

# PostgreSQL. Credentials come from the environment; nothing secret belongs in this file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kuzahealth}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# Schema is owned by Flyway (src/main/resources/db/migration). A database that
# predates Flyway is baselined at V1 on first start, then later versions apply.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.leak-detection-threshold=20000

# Transaction
spring.transaction.default-timeout=30
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.properties.hibernate.connection.release_mode=after_transaction
spring.jpa.open-in-view=false

# JWT. JWT_SECRET is required: a base64 string that decodes to at least 32 bytes.
# JWT_EXPIRATION is the access token lifetime in seconds.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:604800}

# Browser origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://kuzahealth.netlify.app}

# Authentication
# Open registration lets anyone create a HEALTH_WORKER account. Other roles can only
# be assigned by an administrator. Set to false to make account creation admin-only.
app.auth.open-registration=${OPEN_REGISTRATION:true}
app.auth.otp-ttl-minutes=10
app.auth.reset-ttl-minutes=15
app.auth.refresh-ttl-days=30
app.auth.max-password-failures=10
app.auth.lock-minutes=15
# Optional first administrator, created on startup if the account does not exist yet.
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}

# Rate limits (per application instance)
app.rate-limit.auth-per-minute=10
app.rate-limit.sms-per-hour=60
# Trust X-Forwarded-For from the platform proxy so limits and audit logs see the client IP.
server.forward-headers-strategy=framework

# Mail
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.from=${MAIL_FROM:${SPRING_MAIL_USERNAME:}}

# Pindo token
pindo.token=${PINDO_TOKEN:}
pindo.sender=${PINDO_SENDER:PindoTest}


# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.mail.enabled=false
management.endpoint.health.probes.enabled=true
springdoc.show-actuator=true
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
management.endpoints.web.cors.allowed-headers=*
management.endpoints.web.cors.allow-credentials=true


# Time zone used for reminders and for dates shown in messages
app.timezone=${APP_TIMEZONE:Africa/Kigali}

# Automatic reminders. Off by default: turning this on sends SMS to parents and marks
# overdue visits as missed, so enable it deliberately (REMINDERS_ENABLED=true).
app.reminders.enabled=${REMINDERS_ENABLED:false}
# Daily at 08:00 (app.timezone): remind about vaccinations due within the lead time
app.reminders.vaccination-cron=0 0 8 * * *
app.reminders.vaccination-lead-days=2
# Doses overdue by more than this are not chased automatically
app.reminders.vaccination-max-overdue-days=30
# Hourly: remind about visits starting within the lead time, and flag missed visits
app.reminders.visit-cron=0 0 * * * *
app.reminders.visit-lead-hours=24
app.reminders.missed-after-hours=24

# A scheduled dose not given this many days after its due date is reported as overdue
app.immunisation.overdue-after-days=28
