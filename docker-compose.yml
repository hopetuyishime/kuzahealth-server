services:
  db:
    image: postgres:16
    container_name: kuzahealth-postgres
    environment:
      POSTGRES_DB: kuzahealth
      POSTGRES_USER: ${POSTGRES_USER:-kuzahealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      # Host port 5433 so it does not clash with a Postgres installed on the host.
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - kuzahealth-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kuzahealth-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kuzahealth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kuzahealth}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}

volumes:
  kuzahealth-postgres-data:
